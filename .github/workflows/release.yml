name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: Windows
          - runner: ubuntu-24.04
            platform: Linux
            directory: Local-Twitch-Reporting-Dashboard-linux-x64
            asset: Local-Twitch-Reporting-Dashboard-Linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Build and check the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = "dist/windows"
          $setup = "Local-Twitch-Reporting-Dashboard-Windows-x64-Setup.exe"
          $installer = Start-Process -FilePath "$output/$setup" -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installation exited with $($installer.ExitCode)" }
          $exe = @(Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter Local-Twitch-Reporting-Dashboard.exe -Recurse)
          if ($exe.Count -ne 1) { throw "Could not find the per-user dashboard installation." }
          $shortcut = @(Get-ChildItem "$env:APPDATA/Microsoft/Windows/Start Menu/Programs" -Filter 'Local Twitch Reporting Dashboard.lnk' -Recurse)
          if ($shortcut.Count -ne 1) { throw "Could not find the dashboard Start menu shortcut." }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut[0].FullName).TargetPath
          if ($target -ne $exe[0].FullName) { throw "The dashboard shortcut points to the wrong executable." }
          $process = Start-Process -FilePath $exe[0].FullName -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installed dashboard exited with $($process.ExitCode)" }
          New-Item -ItemType Directory -Path release-assets
          Copy-Item "$output/$setup" -Destination release-assets
      - run: npm run package
        if: runner.os == 'Linux'
      - name: Check packaged Linux app and archive it
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLE: ${{ matrix.directory }}
          ASSET: ${{ matrix.asset }}
        run: |
          install -m 0755 packaging/install-launcher.sh "dist/$BUNDLE/install-launcher.sh"
          install -m 0644 assets/icon.png "dist/$BUNDLE/dashboard-icon.png"
          XDG_DATA_HOME="$RUNNER_TEMP/dashboard-launcher-test" bash "dist/$BUNDLE/install-launcher.sh"
          grep -Fx 'StartupWMClass=com.vadian24.local-twitch-reporting-dashboard' "$RUNNER_TEMP/dashboard-launcher-test/applications/com.vadian24.local-twitch-reporting-dashboard.desktop"
          mkdir -p release-assets
          tar -C dist -czf "release-assets/$ASSET" "$BUNDLE"
          # Ubuntu's hosted runner restricts unprivileged user namespaces.
          sudo install -d -m 0755 /opt/twitch-dashboard-smoke
          sudo cp -a "dist/$BUNDLE/." /opt/twitch-dashboard-smoke/
          sudo chown -R root:root /opt/twitch-dashboard-smoke
          sudo chmod -R a+rX /opt/twitch-dashboard-smoke
          sudo chmod 4755 /opt/twitch-dashboard-smoke/chrome-sandbox
          xvfb-run -a /opt/twitch-dashboard-smoke/Local-Twitch-Reporting-Dashboard --smoke-test
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish versioned downloads
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: assets-to-release
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --omit=dev --ignore-scripts
      - name: Prepare signed update statement
        id: update
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          setup="Local-Twitch-Reporting-Dashboard-Windows-x64-Setup.exe"
          digest="$(sha256sum "assets-to-release/$setup" | cut -d' ' -f1)"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign Windows update with release workflow identity
        id: attestation
        uses: actions/attest@v4
        with:
          subject-name: Local-Twitch-Reporting-Dashboard-Windows-x64-Setup.exe
          subject-digest: ${{ steps.update.outputs.digest }}
          predicate-type: https://github.com/vadian24/Local-Twitch-Reporting-Dashboard/windows-update/v1
          predicate: '{"version":"${{ steps.update.outputs.version }}"}'
      - name: Verify signed update before publishing
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
          RELEASE_VERSION: ${{ steps.update.outputs.version }}
        run: |
          cp -- "$BUNDLE_PATH" assets-to-release/windows-update.sigstore.json
          node - <<'NODE'
          const { verifyInstaller, assetName, bundleName } = require('./src/verify-update');
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { verify } = require('sigstore');
          const root = 'assets-to-release/';
          const bundle = JSON.parse(fs.readFileSync(root + bundleName, 'utf8'));
          async function check() {
            await verifyInstaller(root + assetName, bundle, process.env.RELEASE_VERSION);
            await assert.rejects(verify(bundle, {
              certificateIssuer: 'https://token.actions.githubusercontent.com',
              certificateIdentityURI: '^https://github[.]com/wrong-workflow$'
            }));
            console.log('Signed Windows update validated. Wrong workflow identity rejected.');
          }
          check().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test -s assets-to-release/Local-Twitch-Reporting-Dashboard-Windows-x64-Setup.exe
          test -s assets-to-release/Local-Twitch-Reporting-Dashboard-Linux-x64.tar.gz
          gh release create "$tag" assets-to-release/* --target "$GITHUB_SHA" \
            --title "Local Twitch Reporting Dashboard $tag" --generate-notes
